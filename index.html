
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Pertamaku</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f0f4f8;
            padding: 50px 20px;
        }

        h1 {
            color: #2563eb;
        }

        button {
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            border: none;

        }

</head>
<body>
    <h1>Halo, Dunia!</h1>
    <p>Ini adalah website pertama saya.</p>

    <button onclick="sapa()">Klik Saya</button>

    <script>
        function sapa() {
            alert("Selamat! JavaScript kamu berhasil berjalan.");
        }
    </script>
</body>
</html>
